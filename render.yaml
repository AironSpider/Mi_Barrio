services:
  - type: web
    name: mi-barrio-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./mi_barrio_backend/Dockerfile
    dockerContext: ./mi_barrio_backend
    healthCheckPath: /health/live
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MI_BARRIO_JWT_SECRET
        generateValue: true
